
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trader website</title>
    <style>
        body {
            font-family: arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .hero {
            background-color: #3498db;
            color: #fff;
            padding: 100px;
            text-align: center;
        }
        .hero h1 {
            font-size: 48px;
        }
        .hero p {
            font-size: 18px;
        }
        .ethereum-price {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .ethereum-price h2 {
            font-size: 24px;
            margin-top: 0;
        }
        .pricing {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .pricing h2 {
            font-size: 24px;
            margin-top: 0;
        }
        .pricing ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .pricing li {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .pricing li:last-child {
            border-bottom: none;
        }
        .cta {
            background-color: #6c5ce7;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .cta:hover {
            background-color: #5c47c6;
        }
        .footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
        .footer a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>trader website</h1>
        <p>trade with confidence</p>
    </div>
    <div class="ethereum-price">
        <h2>ethereum price</h2>
        <p>$3,456.78</p>
    </div>
    <div class="pricing">
        <h2>pricing</h2>
        <ul>
            <li>basic: $9.99/month</li>
            <li>premium: $19.99/month</li>
            <li>enterprise: $49.99/month</li>
        </ul>
    </div>
    <button class="cta">get started</button>
    <div class="footer">
        <a href="#">twitter</a>
        <a href="#">facebook</a>
        <a href="#">instagram</a>
    </div>
</body>
</html>
